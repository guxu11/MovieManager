<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Movie Manager</title>
    <link rel="stylesheet" href="./styles.css">
  </head>
  <body class="extension-popup">
    <main class="app-shell">
      <header class="topbar">
        <div>
          <h1>Movie Manager</h1>
          <p>搜索番号，确认文件在哪台设备和目录下。</p>
        </div>
        <button id="settingsToggle" class="icon-button" title="同步设置" aria-label="同步设置">⚙</button>
      </header>

      <section id="settingsPanel" class="panel settings-panel hidden" aria-label="同步设置">
        <div class="panel-head">
          <h2>云端 API</h2>
          <span id="storageMode" class="badge">本地 demo</span>
        </div>
        <div class="form-grid">
          <label>
            API Base URL
            <input id="apiBaseUrl" type="url" placeholder="https://your-app.vercel.app" autocomplete="off">
          </label>
          <label>
            Sync token
            <input id="syncToken" type="password" placeholder="Vercel 环境变量 SYNC_TOKEN" autocomplete="off">
          </label>
        </div>
        <div class="actions">
          <button id="saveSettings" class="primary-button">保存配置</button>
          <button id="checkNativeHelper" class="ghost-button">检测本机 Helper</button>
          <button id="clearSettings" class="ghost-button">清除</button>
        </div>
        <div id="nativeHelperStatus" class="muted settings-status"></div>
      </section>

      <nav class="tabs" aria-label="页面">
        <button class="tab active" data-tab="search">搜索</button>
        <button class="tab" data-tab="sync">同步</button>
        <button class="tab" data-tab="sources">目录</button>
      </nav>

      <div class="view-port">
        <section id="searchTab" class="view">
          <div class="panel search-panel">
            <form id="searchForm" class="search-row">
              <input id="searchInput" type="search" placeholder="输入 ABC-123 / abc123 / 文件名" autocomplete="off">
              <button class="primary-button" type="submit">搜索</button>
            </form>
            <div id="searchMeta" class="muted">输入番号后会优先精确匹配，找不到时再按文件名候选。</div>
          </div>
          <div id="results" class="results"></div>
        </section>

        <section id="syncTab" class="view hidden">
          <div class="panel">
            <div class="panel-head">
              <h2>同步目录</h2>
              <span class="muted">只上传索引，不上传电影文件。</span>
            </div>
            <div class="form-grid">
              <label>
                设备名
                <input id="deviceName" placeholder="MacBook / Windows / Mac mini">
                <span class="field-hint">自动建议，可改成你习惯的名字。</span>
              </label>
            </div>
            <details class="advanced-options">
              <summary>高级选项</summary>
              <div class="form-grid advanced-grid">
                <label>
                  目录名
                  <input id="sourceName" placeholder="默认使用你选择的目录名">
                </label>
                <label>
                  路径备注
                  <input id="pathLabel" placeholder="可选，比如 /Users/xugu/Downloads 或 D:\\movies">
                </label>
              </div>
            </details>
            <div class="actions">
              <button id="pickDirectory" class="primary-button">选择目录并同步</button>
              <label class="file-fallback">
                <span>兼容模式选择目录</span>
                <input id="directoryInput" type="file" webkitdirectory multiple>
              </label>
            </div>
            <div id="syncStatus" class="sync-status muted">等待选择目录。</div>
          </div>
        </section>

        <section id="sourcesTab" class="view hidden">
          <div class="panel">
            <div class="panel-head">
              <h2>已同步目录</h2>
              <button id="refreshSources" class="ghost-button">刷新</button>
            </div>
            <div id="sourcesList" class="source-list"></div>
          </div>
        </section>
      </div>
    </main>

    <template id="resultTemplate">
      <article class="result-card">
        <div class="result-main">
          <h3></h3>
          <p class="muted"></p>
        </div>
        <div class="result-path"></div>
        <div class="result-footer"></div>
      </article>
    </template>

    <script src="./config.js"></script>
    <script src="./app.js" type="module"></script>
  </body>
</html>
